# Save as .github/workflows/daily-menu.yml in a GitHub repo containing menu_email.py
name: daily-menu
on:
  schedule:
    - cron: "0 14 * * *"   # 14:00 UTC = 7:00 AM PDT (6:00 AM PST after Nov 1). GitHub cron is UTC-only.
  workflow_dispatch: {}     # lets you click "Run workflow" to test

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests beautifulsoup4
      - run: python menu_email.py
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
